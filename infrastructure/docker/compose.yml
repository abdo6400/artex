services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: artex
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: artex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - artex-postgres-data:/var/lib/postgresql

volumes:
  artex-postgres-data:
